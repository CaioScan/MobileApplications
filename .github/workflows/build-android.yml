name: Compilar Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verificar e gerar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código e tipos
        run: |
          npm run lint
          npm run typecheck

      - name: Gerar o bundle Android
        run: npx --no-install expo export --platform android --output-dir dist --max-workers 2

      - name: Gerar o projeto nativo
        run: npx --no-install expo prebuild --platform android --no-install

      - name: Compilar o APK de depuração
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Disponibilizar o APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
